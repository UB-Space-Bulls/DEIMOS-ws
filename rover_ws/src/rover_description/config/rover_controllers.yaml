controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # No stock ros2_controllers swerve plugin exists, so steering and wheel
    # speed are driven as two plain pass-through controllers. The
    # rover_swerve_controller package's swerve_kinematics_node computes the
    # actual per-module angles/speeds from /cmd_vel and publishes to these.
    steer_controller:
      type: forward_command_controller/ForwardCommandController

    wheel_controller:
      type: forward_command_controller/ForwardCommandController

# Order here must match MODULES in swerve_kinematics_node.py -- that's the
# order the node publishes command values in.
steer_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint
    interface_name: position

wheel_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: velocity
