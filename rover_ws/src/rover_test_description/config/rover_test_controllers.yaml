controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Plain pass-through controllers, same as rover_description -- this
    # package doesn't run rover_swerve_controller's kinematics node, so
    # these are only useful for driving individual joints directly (e.g.
    # via `ros2 topic pub`) to sanity-check the CAD model in Gazebo.
    steer_controller:
      type: forward_command_controller/ForwardCommandController

    wheel_controller:
      type: forward_command_controller/ForwardCommandController

steer_controller:
  ros__parameters:
    joints:
      - rear_left_steer_joint
      - front_left_steer_joint
      - rear_right_steer_joint
      - front_right_steer_joint
    interface_name: position

wheel_controller:
  ros__parameters:
    joints:
      - rear_left_wheel_joint
      - front_left_wheel_joint
      - rear_right_wheel_joint
      - front_right_wheel_joint
    interface_name: velocity
